[workspace]
resolver = "2"
members = [
    "crates/pvpn-core",
    "crates/pvpn",
]
# `legacy/pvpnd` is the removed daemon, kept for reference only. It is not
# built, and naming it here stops cargo treating it as a stray member.
exclude = ["legacy"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "process", "time", "sync", "macros", "io-util", "fs", "signal"] }
native-tls = "0.2"
tokio-native-tls = "0.3"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"

[profile.release]
opt-level = 2
