# Closing the lid locks the session instead of suspending it, so the tunnel
# survives.
#
# GNOME's own lid-close-ac-action / lid-close-battery-action are usually
# already set to 'nothing' and are dead keys: gnome-settings-daemon does not
# claim a handle-lid-switch inhibitor, so logind's default
# HandleLidSwitch=suspend wins and every lid close becomes a real suspend.
# The Caffeine extension cannot help -- it takes an *idle* inhibitor, and
# logind's lid handling only backs off for a handle-lid-switch *block*
# inhibitor.
#
# The trade-off: a closed laptop now stays fully awake. Heat in a bag, and
# battery drain. To keep that only while plugged in, set HandleLidSwitch back
# to suspend and leave HandleLidSwitchExternalPower=lock.
[Login]
HandleLidSwitch=lock
HandleLidSwitchExternalPower=lock
HandleLidSwitchDocked=ignore
